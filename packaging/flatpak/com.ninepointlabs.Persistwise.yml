# Self-hosted Flatpak bundle for Persistwise Desktop.
# Never submitted to Flathub. Built in CI (.github/workflows/linux.yml) and
# attached to the GitHub release as a single-file .flatpak bundle.
#
# It packages the release binary built on Ubuntu 22.04 (glibc 2.35, older
# than the GNOME runtime's), so the GNOME runtime's WebKitGTK 4.1 is used.
# Build locally:  scripts/build-flatpak.sh  (needs flatpak + flatpak-builder)
id: com.ninepointlabs.Persistwise
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: persistwise-desktop
finish-args:
  - --share=network        # fetch pages you save; optional Wayback/IPFS
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # No home-directory access: the archive lives in the app's own data dir
  # (~/.var/app/com.ninepointlabs.Persistwise/data/persistwise) and imports
  # are picked through the file-chooser portal.
modules:
  - name: persistwise-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 persistwise-desktop /app/bin/persistwise-desktop
      - install -Dm644 com.ninepointlabs.Persistwise.desktop /app/share/applications/com.ninepointlabs.Persistwise.desktop
      - install -Dm644 com.ninepointlabs.Persistwise.metainfo.xml /app/share/metainfo/com.ninepointlabs.Persistwise.metainfo.xml
      - install -Dm644 com.ninepointlabs.Persistwise.svg /app/share/icons/hicolor/scalable/apps/com.ninepointlabs.Persistwise.svg
      - for s in 16 24 32 48 64 128 256 512; do install -Dm644 hicolor/${s}x${s}/com.ninepointlabs.Persistwise.png /app/share/icons/hicolor/${s}x${s}/apps/com.ninepointlabs.Persistwise.png; done
    sources:
      - type: file
        path: ../../target/release/persistwise-desktop
      - type: file
        path: ../linux/com.ninepointlabs.Persistwise.desktop
      - type: file
        path: ../linux/com.ninepointlabs.Persistwise.metainfo.xml
      - type: file
        path: ../../assets/icons/com.ninepointlabs.Persistwise.svg
      - type: dir
        path: ../../assets/icons/hicolor
        dest: hicolor
