# Linux: tests, AppImage, self-hosted Flatpak bundle, and .deb/.rpm/Arch
# packages (each installed and started in a clean distro container).
#
# Runs on every pull request (build and checks only), when Tim publishes a
# release (attaches the Linux files to it), or by hand (Actions > Linux >
# Run workflow; optional tag to backfill a release).
name: Linux

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach files to (leave empty to only build)"
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04   # glibc 2.35 keeps the AppImage working on older distros
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev librsvg2-bin \
            libayatana-appindicator3-dev \
            patchelf file desktop-file-utils appstream zsync xvfb xauth dbus-x11 \
            flatpak dpkg-dev rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format, lint, test
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --no-fail-fast

      - name: AppImage
        run: |
          npm ci --no-audit --no-fund
          ./scripts/build-appimage.sh

      - name: AppImage checks
        run: |
          set -eux
          AI=$(ls dist/persistwise-desktop-*-x86_64.AppImage)
          desktop-file-validate packaging/linux/com.ninepointlabs.Persistwise.desktop
          desktop-file-validate build/appimage/squashfs-root/com.ninepointlabs.Persistwise.desktop
          appstreamcli validate --no-net packaging/linux/com.ninepointlabs.Persistwise.metainfo.xml
          for s in 16 24 32 48 64 128 256 512; do
            file build/appimage/squashfs-root/usr/share/icons/hicolor/${s}x${s}/apps/com.ninepointlabs.Persistwise.png | grep "$s x $s"
          done
          test -f build/appimage/squashfs-root/usr/share/icons/hicolor/scalable/apps/com.ninepointlabs.Persistwise.svg
          test -L build/appimage/squashfs-root/.DirIcon
          # Headless launch with a throwaway HOME and no Omarchy/Hyprland.
          export HOME=$(mktemp -d) PERSISTWISE_DATA_DIR=$(mktemp -d)/data
          "$AI" --appimage-extract-and-run --self-test
          "$AI" --appimage-extract-and-run --import crates/core/tests/fixtures/export-v1
          xvfb-run -a dbus-run-session -- "$AI" --appimage-extract-and-run --smoke-test
          # Children must not inherit the bundled library paths.
          "$AI" --appimage-extract-and-run --print-child-env > child-env.txt
          test -s child-env.txt || { echo "::error::child-env.txt is missing or empty"; exit 1; }
          if grep -E "\.mount_|appimage_extracted" child-env.txt; then
            echo "::error::child environment still points into the AppImage"; exit 1
          fi
          # Opt-in desktop integration, in a temp XDG_DATA_HOME.
          export XDG_DATA_HOME=$(mktemp -d)
          APPIMAGE="$PWD/$AI" build/appimage/squashfs-root/AppRun --install-desktop-entry
          desktop-file-validate "$XDG_DATA_HOME/applications/com.ninepointlabs.Persistwise.desktop"
          grep "^Exec=\"$PWD/$AI\"" "$XDG_DATA_HOME/applications/com.ninepointlabs.Persistwise.desktop"
          build/appimage/squashfs-root/AppRun --remove-desktop-entry
          test ! -e "$XDG_DATA_HOME/applications/com.ninepointlabs.Persistwise.desktop"
          du -h "$AI"

      - name: deb, rpm and PKGBUILD
        run: |
          ./scripts/build-linux-packages.sh
          objdump -T target/release/persistwise-desktop | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - name: appimagelint (report only)
        continue-on-error: true
        run: |
          curl -fsSL -o appimagelint https://github.com/TheAssassin/appimagelint/releases/download/continuous/appimagelint-x86_64.AppImage
          chmod +x appimagelint
          ./appimagelint --appimage-extract-and-run dist/persistwise-desktop-*-x86_64.AppImage || true

      - name: Free disk space for Flatpak
        run: |
          df -h /
          # Built artefacts no longer needed (the release binary stays).
          rm -rf target/debug build/appimage/squashfs-root
          # Large preinstalled toolchains this job never uses.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Flatpak bundle
        run: ./scripts/build-flatpak.sh

      - name: Flatpak checks
        run: |
          set -eux
          flatpak install --user -y --noninteractive dist/persistwise-desktop-*-x86_64.flatpak
          # Every library (WebKitGTK 4.1 above all) must come from the runtime.
          flatpak run --command=sh com.ninepointlabs.Persistwise -c 'ldd /app/bin/persistwise-desktop' | tee flatpak-ldd.txt
          test -s flatpak-ldd.txt || { echo "::error::flatpak-ldd.txt is missing or empty"; exit 1; }
          if grep "not found" flatpak-ldd.txt; then
            echo "::error::Flatpak binary has unresolved libraries"; exit 1
          fi
          flatpak run com.ninepointlabs.Persistwise --self-test
          du -h dist/*.flatpak

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/*.AppImage.sha256
            dist/*.flatpak
            dist/*.flatpak.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/*.rpm
            dist/*.rpm.sha256
            dist/PKGBUILD

  arch:
    # Builds the Arch package from the generated PKGBUILD (makepkg as a
    # non-root user; the .deb is picked up from the folder, not downloaded),
    # then installs it with pacman and starts it.
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - name: makepkg
        run: |
          set -eux
          pacman -Syu --noconfirm --needed namcap
          useradd -m builder
          install -d -o builder /home/builder/pkg
          install -o builder dist/PKGBUILD dist/*.deb /home/builder/pkg/
          cd /home/builder/pkg
          sudo -u builder makepkg --nodeps --noconfirm
          sudo -u builder namcap PKGBUILD *.pkg.tar.zst || true
      - name: Install and start
        run: |
          set -eux
          pacman -U --noconfirm /home/builder/pkg/*.pkg.tar.zst
          pacman -Qi persistwise-desktop-bin
          if ldd /usr/bin/persistwise-desktop | grep "not found"; then exit 1; fi
          test -f /usr/share/applications/com.ninepointlabs.Persistwise.desktop
          test -f /usr/share/licenses/persistwise-desktop-bin/LICENSE
          export HOME=$(mktemp -d) PERSISTWISE_DATA_DIR=$(mktemp -d)/data
          persistwise-desktop --version
          sudo -u builder env PERSISTWISE_DATA_DIR=/tmp/pw-arch persistwise-desktop --self-test
      - name: Collect
        run: |
          mkdir -p arch-out
          cp /home/builder/pkg/*.pkg.tar.zst arch-out/
          cd arch-out && for f in *.pkg.tar.zst; do sha256sum "$f" > "$f.sha256"; done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: |
            arch-out/*.pkg.tar.zst
            arch-out/*.pkg.tar.zst.sha256

  deb-check:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12"]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - name: Install and start
        run: |
          set -eux
          apt-get update
          # dpkg -i does not fetch dependencies; apt-get -f install does.
          dpkg -i dist/*.deb || DEBIAN_FRONTEND=noninteractive apt-get install -y -f
          dpkg -s persistwise-desktop
          if ldd /usr/bin/persistwise-desktop | grep "not found"; then exit 1; fi
          test -f /usr/share/applications/com.ninepointlabs.Persistwise.desktop
          export HOME=$(mktemp -d) PERSISTWISE_DATA_DIR=$(mktemp -d)/data
          persistwise-desktop --version
          persistwise-desktop --self-test
          apt-get remove -y persistwise-desktop
          test ! -e /usr/bin/persistwise-desktop

  rpm-check:
    needs: build
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - name: Install and start
        run: |
          set -eux
          dnf install -y dist/*.rpm
          rpm -qi persistwise-desktop
          rpm -V persistwise-desktop
          if ldd /usr/bin/persistwise-desktop | grep "not found"; then exit 1; fi
          test -f /usr/share/applications/com.ninepointlabs.Persistwise.desktop
          export HOME=$(mktemp -d) PERSISTWISE_DATA_DIR=$(mktemp -d)/data
          persistwise-desktop --version
          persistwise-desktop --self-test
          dnf remove -y persistwise-desktop
          test ! -e /usr/bin/persistwise-desktop

  attach:
    # Additive only: uploads the Linux files the release does not have yet.
    # Never deletes or replaces an asset, so a manual run with a tag only
    # fills in what is missing.
    needs: [build, arch, deb-check, rpm-check]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-package*"
          merge-multiple: true
          path: dist
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -eu
          existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          new=()
          for f in dist/*.AppImage dist/*.AppImage.zsync dist/*.AppImage.sha256 \
                   dist/*.flatpak dist/*.flatpak.sha256 \
                   dist/*.deb dist/*.deb.sha256 dist/*.rpm dist/*.rpm.sha256 \
                   dist/*.pkg.tar.zst dist/*.pkg.tar.zst.sha256 dist/PKGBUILD; do
            if grep -qxF "$(basename "$f")" <<<"$existing"; then
              echo "already on the release, left as is: $(basename "$f")"
            else
              new+=("$f")
            fi
          done
          if [ ${#new[@]} -gt 0 ]; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "${new[@]}"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'
