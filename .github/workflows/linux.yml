# Linux: tests, AppImage and self-hosted Flatpak bundle.
#
# Runs on every pull request (build and checks only), when Tim publishes a
# release (attaches the Linux files to it), or by hand (Actions > Linux >
# Run workflow; optional tag to backfill a release).
name: Linux

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach files to (leave empty to only build)"
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04   # glibc 2.35 keeps the AppImage working on older distros
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev librsvg2-bin \
            libayatana-appindicator3-dev \
            patchelf file desktop-file-utils appstream zsync xvfb xauth dbus-x11 \
            flatpak

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format, lint, test
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --no-fail-fast

      - name: AppImage
        run: |
          npm ci --no-audit --no-fund
          ./scripts/build-appimage.sh

      - name: AppImage checks
        run: |
          set -eux
          AI=$(ls dist/persistwise-desktop-*-x86_64.AppImage)
          desktop-file-validate packaging/linux/com.ninepointlabs.Persistwise.desktop
          desktop-file-validate build/appimage/squashfs-root/com.ninepointlabs.Persistwise.desktop
          appstreamcli validate --no-net packaging/linux/com.ninepointlabs.Persistwise.metainfo.xml
          for s in 16 24 32 48 64 128 256 512; do
            file build/appimage/squashfs-root/usr/share/icons/hicolor/${s}x${s}/apps/com.ninepointlabs.Persistwise.png | grep "$s x $s"
          done
          test -f build/appimage/squashfs-root/usr/share/icons/hicolor/scalable/apps/com.ninepointlabs.Persistwise.svg
          test -L build/appimage/squashfs-root/.DirIcon
          # Headless launch with a throwaway HOME and no Omarchy/Hyprland.
          export HOME=$(mktemp -d) PERSISTWISE_DATA_DIR=$(mktemp -d)/data
          "$AI" --appimage-extract-and-run --self-test
          "$AI" --appimage-extract-and-run --import crates/core/tests/fixtures/export-v1
          xvfb-run -a dbus-run-session -- "$AI" --appimage-extract-and-run --smoke-test
          # Children must not inherit the bundled library paths.
          "$AI" --appimage-extract-and-run --print-child-env > child-env.txt
          ! grep -E "\.mount_|appimage_extracted" child-env.txt
          # Opt-in desktop integration, in a temp XDG_DATA_HOME.
          export XDG_DATA_HOME=$(mktemp -d)
          APPIMAGE="$PWD/$AI" build/appimage/squashfs-root/AppRun --install-desktop-entry
          desktop-file-validate "$XDG_DATA_HOME/applications/com.ninepointlabs.Persistwise.desktop"
          grep "^Exec=\"$PWD/$AI\"" "$XDG_DATA_HOME/applications/com.ninepointlabs.Persistwise.desktop"
          build/appimage/squashfs-root/AppRun --remove-desktop-entry
          test ! -e "$XDG_DATA_HOME/applications/com.ninepointlabs.Persistwise.desktop"
          du -h "$AI"

      - name: appimagelint (report only)
        continue-on-error: true
        run: |
          curl -fsSL -o appimagelint https://github.com/TheAssassin/appimagelint/releases/download/continuous/appimagelint-x86_64.AppImage
          chmod +x appimagelint
          ./appimagelint --appimage-extract-and-run dist/persistwise-desktop-*-x86_64.AppImage || true

      - name: Free disk space for Flatpak
        run: |
          df -h /
          # Built artefacts no longer needed (the release binary stays).
          rm -rf target/debug build/appimage/squashfs-root
          # Large preinstalled toolchains this job never uses.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Flatpak bundle
        run: ./scripts/build-flatpak.sh

      - name: Flatpak checks
        run: |
          set -eux
          flatpak install --user -y --noninteractive dist/persistwise-desktop-*-x86_64.flatpak
          # Every library (WebKitGTK 4.1 above all) must come from the runtime.
          flatpak run --command=sh com.ninepointlabs.Persistwise -c 'ldd /app/bin/persistwise-desktop' | tee flatpak-ldd.txt
          ! grep "not found" flatpak-ldd.txt
          flatpak run com.ninepointlabs.Persistwise --self-test
          du -h dist/*.flatpak

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/*.AppImage.sha256
            dist/*.flatpak
            dist/*.flatpak.sha256

  attach:
    # Additive only: uploads the Linux files to the release, never deletes assets.
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/*.AppImage dist/*.AppImage.zsync dist/*.AppImage.sha256 dist/*.flatpak dist/*.flatpak.sha256
